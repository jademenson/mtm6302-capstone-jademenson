<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Astronomy Picture of the Day</title>
        <!-- Bootstrap CSS-->
         <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
         <!--Custom CSS-->
         <link rel="stylesheet" href="main.css">
    </head>
    <body>
        <div class="container my-5">
            <!-- Header -->
             <header class="text-center mb-4">
                <h1>Astronomy Picture of the Day</h1>
             </header>

             <!-- Date Selection form -->
              <section id="date-form-selection" class="mb-5">
                <form id="date-form" class="row g-3 justify-content-center">
                    <div class="col-auto">
                        <label for="apod-date" class="visually-hidden">Select Date</label>
                        <input type="date" id="apod-date" name="apod-date" class="form-control" max="">
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary mb-3">Get Picture</button>
                    </div>
                </form>
              </section>

              <!-- APOD Display Section -->
               <section id="apod-display-section" class="mb-5 d-none">
                <div class="card">
                    <img src="" class="card-img-top" alt="Astronomy Picture of the Day" id="apod-image">
                    <div class="card-body">
                        <h5 class="card-title" id="apod-title"></h5>
                        <p class="card-text"><small class="text-muted" id="apod-date-display"></small></p>
                        <p class="card-text" id="apod-explanation"></p>
                        <button class="btn btn-success" id="add-favorite-btn">Add to Favorites</button>
                    </div>
                </div>
               </section>


               <!-- Favorites Section -->
                <section id="favorites-section">
                    <h2>Favorites</h2>
                    <div class="row" id="favorites-container">
                        <!-- Favorites items will be appended here -->
                    </div>
                </section>
        </div>

        <!-- Modal for High Definition Image -->
         <div class="modal fade" id="hdImageModal" tabindex="-1" aria-labelledby="hdImageModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="hdImageModalLabel">High Definition Image</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body text-center">
                        <img src="" alt="High Definition APOD" id="hd-apod-image" class="img-fluid">
                    </div>
                </div>
            </div>
         </div>
    </body>
</html>
